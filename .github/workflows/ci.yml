name: CI

# Runs the repo's shell tests on push and PR. This mainly guards the owner's own
# pushes and PRs: close-prs.yml auto-closes PRs from non-owners before they can
# be reviewed, which is intended.
#
# CI deliberately does not evaluate or build the nix-darwin config: `nix flake
# check` is not run here, and the full darwin system closure is never built on a
# runner (it is long and costly). The machine rebuilds and evaluates the flake
# locally via rebuild.sh; CI's job is to run the tests/ suite.
on:
  push:
  pull_request:

# Only the latest run per ref needs to finish; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Shell tests
    # The tests/ suite is plain shell + node and skips macOS-only paths (pi/tmux)
    # gracefully, so it runs on the cheaper Linux runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests/*.test.sh
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.test.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no tests found under tests/" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
