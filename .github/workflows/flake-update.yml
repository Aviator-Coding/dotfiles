name: Update flake.lock

# Light "CD" for a personal dotfiles repo: there is no remote deploy target
# (the machine rebuilds locally via rebuild.sh), so the closest sensible
# automation is keeping inputs fresh. This runs `nix flake update` on a schedule
# and opens a PR bumping flake.lock for the owner to review and rebuild locally.
on:
  schedule:
    # Mondays at 06:00 UTC - a weekly nudge without churning PRs constantly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    name: Bump flake.lock
    # `nix flake update` only refetches input metadata and rewrites flake.lock;
    # it builds nothing, so ubuntu-latest is sufficient here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix (Determinate Systems, flakes enabled)
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Update flake inputs
        # Leave the flake.lock change uncommitted; create-pull-request commits it.
        run: nix flake update

      - name: Open pull request
        # Created with the built-in GITHUB_TOKEN. PRs opened by GITHUB_TOKEN do
        # not trigger other workflows on creation, so ci.yml does not auto-run
        # when this PR is opened; the owner reviews and rebuilds locally.
        # close-prs.yml also explicitly excludes github-actions[bot], so this PR
        # survives even a manual reopen (which does fire close-prs.yml's
        # pull_request_target trigger).
        # Requires repo setting: Settings -> Actions -> General ->
        # "Allow GitHub Actions to create and approve pull requests".
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/flake-update
          delete-branch: true
          title: "chore(flake): update flake.lock"
          commit-message: "chore(flake): update flake.lock"
          body: |
            Automated weekly `nix flake update`.

            Review the input bumps, then rebuild locally with `./rebuild.sh`.

            Note: opened with the built-in `GITHUB_TOKEN`, so CI does not run on
            this PR automatically. Close and reopen it (or push an empty commit)
            to trigger `ci.yml` if you want the checks first.
